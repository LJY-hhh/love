le.style.bottom = '-20px';\n            document.querySelector('.love-rain').appendChild(particle);\n            // Animate the particle\n            setTimeout(() => {\n                particle.style.bottom = '100%';\n            }, 100);\n        }\n    </script>\n</body>\n</html>
