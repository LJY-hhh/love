<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情人节快乐</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Microsoft YaHei", sans-serif;
}

/* LOVE数字雨 */
#loveBg {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 1;
    transition: opacity 1s ease;
}

/* 开场文字 */
.text-item {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    text-shadow: 0 0 30px #ff4da6;
    opacity: 0;
    white-space: nowrap;
}

.dear { font-size: 90px; animation: fade 1.5s 0.5s forwards; }
.year { font-size: 70px; animation: fade 1.5s 2s forwards; }
.valentine { font-size: 80px; animation: fade 1.5s 4s forwards; }

@keyframes fade {
    0% {opacity:0; transform:translate(-50%,-50%) scale(0.5);}
    20% {opacity:1; transform:translate(-50%,-50%) scale(1.1);}
    80% {opacity:1;}
    100% {opacity:0;}
}

/* 爱心画布 */
#heartCanvas {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.5s ease;
}

/* 内外文字 */
.inner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff66b2;
    font-size: 50px;
    text-shadow: 0 0 20px #ff66b2;
    opacity: 0;
    animation: show 1s 5s forwards;
    z-index: 2;
}

.outer-text {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 22px;
    text-shadow: 0 0 15px #fff;
    opacity: 0;
    animation: show 1s 5s forwards;
    z-index: 2;
}

@keyframes show {
    to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="loveBg"></canvas>

<div class="text-item dear">亲爱的泉</div>
<div class="text-item year">2026</div>
<div class="text-item valentine">情人节快乐</div>

<canvas id="heartCanvas"></canvas>

<div class="inner-text">I LOVE YOU</div>
<div class="outer-text">When I am with you, I never envy anyone.</div>

<script>
/* LOVE数字雨 */
const bg = document.getElementById("loveBg");
const bgCtx = bg.getContext("2d");
bg.width = window.innerWidth;
bg.height = window.innerHeight;

const letters = ["L","O","V","E","❤"];
const size = 16;
const columns = Math.floor(bg.width / size);
const drops = Array(columns).fill(0);

function drawRain(){
    bgCtx.fillStyle="rgba(0,0,0,0.05)";
    bgCtx.fillRect(0,0,bg.width,bg.height);
    bgCtx.fillStyle="#ff4da688";
    bgCtx.font=size+"px monospace";
    drops.forEach((y,i)=>{
        const text=letters[Math.floor(Math.random()*letters.length)];
        bgCtx.fillText(text,i*size,y*size);
        if(y*size>bg.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    });
}

/* 粒子爱心 */
const heart = document.getElementById("heartCanvas");
const ctx = heart.getContext("2d");
heart.width = window.innerWidth;
heart.height = window.innerHeight;

let particles=[];
let pulse=0;

function heartX(t,s){ return s*16*Math.pow(Math.sin(t),3); }
function heartY(t,s){
 return -s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
}

function init(){
    particles=[];
    for(let i=0;i<3000;i++){
        const t=Math.random()*Math.PI*2;
        const s=15+Math.random()*5;
        particles.push({x:heartX(t,s),y:heartY(t,s),size:Math.random()*1.2+0.6});
    }
}
init();

function drawHeart(){
    ctx.clearRect(0,0,heart.width,heart.height);
    pulse+=0.05;
    const beat=1+0.12*Math.sin(pulse);

    particles.forEach(p=>{
        const x=heart.width/2+p.x*beat;
        const y=heart.height/2+p.y*beat;
        ctx.beginPath();
        ctx.arc(x,y,p.size*2,0,Math.PI*2);
        ctx.fillStyle="rgba(255,80,150,0.9)";
        ctx.fill();
    });
}

function animate(){
    drawRain();
    drawHeart();
    requestAnimationFrame(animate);
}
animate();

/* 5秒后同步显示爱心 */
setTimeout(()=>{
    bg.style.opacity=0.2;
    heart.style.opacity=1;
},5000);

window.onresize=()=>{
    bg.width=window.innerWidth;
    bg.height=window.innerHeight;
    heart.width=window.innerWidth;
    heart.height=window.innerHeight;
    init();
};
</script>

</body>
</html>
